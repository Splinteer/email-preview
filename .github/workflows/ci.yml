name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @supplydatahub/email-preview test
      - run: pnpm --filter @supplydatahub/email-preview build
      - run: pnpm --filter @supplydatahub/email-preview-angular build
      - run: pnpm --filter @supplydatahub/email-preview-playground build
